name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and verify generated files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile scripts/*.py
          node --check engine/engine_template.js
          node --check engine/ag_localization_engine.js

      - name: Verify generated files are current
        run: |
          python scripts/build.py --no-exe
          git diff --exit-code -- scripts/patcher.py engine/ag_localization_engine.js

      - name: Verify README dictionary counts
        run: |
          python - <<'EOF'
          import json, re, sys
          entries = len(json.load(open('locales/zh-CN.json', encoding='utf-8')))
          rules = len(json.load(open('locales/patterns.json', encoding='utf-8')))
          expected = (f'{entries:,}', str(rules))
          failed = False
          for path in ('README.md', 'README_EN.md'):
              text = open(path, encoding='utf-8').read()
              for exp in expected:
                  if exp not in text:
                      print(f"[!] {path}: advertised count '{exp}' missing (actual: {entries} entries / {rules} rules)")
                      failed = True
              for m in re.finditer(r'\b1,\d{3}\b', text):
                  if m.group(0) != f'{entries:,}':
                      print(f"[!] {path}: stale entry count '{m.group(0)}' (actual: {entries:,})")
                      failed = True
          if not failed:
              print(f"[+] README counts match locales: {entries} entries / {rules} rules")
          sys.exit(1 if failed else 0)
          EOF

  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact_name: antigravity-zh-windows
            dist_file: dist/antigravity-zh.exe
            release_file: antigravity-zh-windows.exe
          - os: macos-latest
            arch: arm64
            artifact_name: antigravity-zh-macos-arm64
            dist_file: dist/antigravity-zh
            release_file: antigravity-zh-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          python scripts/build.py

      - name: Prepare binary artifact
        shell: bash
        run: |
          if [ -f "${{ matrix.dist_file }}" ]; then
            cp "${{ matrix.dist_file }}" "${{ matrix.release_file }}"
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              chmod +x "${{ matrix.release_file }}"
              chmod +x 安装汉化.command 还原官方.command install.sh restore.sh status.sh
              
              # Create structured macOS distribution directory
              mkdir -p macos_dist/scripts macos_dist/locales
              cp "${{ matrix.release_file }}" macos_dist/
              cp 安装汉化.command 还原官方.command install.sh restore.sh status.sh macos_dist/
              cp scripts/patcher.py macos_dist/scripts/
              cp locales/*.json macos_dist/locales/
              cp README.md macos_dist/
              
              # Package into double-clickable zip and tar.gz
              cd macos_dist
              zip -r "../${{ matrix.release_file }}.zip" .
              tar -czvf "../${{ matrix.release_file }}.tar.gz" .
              cd ..
            fi
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.release_file }}
            *.zip
            *.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all_artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release_assets
          find all_artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o -name "antigravity-zh-macos-arm64" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Generate SHA256 checksums
        working-directory: release_assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
