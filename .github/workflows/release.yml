name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: antigravity-zh-windows
            dist_file: dist/antigravity-zh.exe
            release_file: antigravity-zh-windows.exe
          - os: macos-latest
            artifact_name: antigravity-zh-macos
            dist_file: dist/antigravity-zh
            release_file: antigravity-zh-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          python scripts/build.py

      - name: Prepare binary artifact
        shell: bash
        run: |
          if [ -f "${{ matrix.dist_file }}" ]; then
            cp "${{ matrix.dist_file }}" "${{ matrix.release_file }}"
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              chmod +x "${{ matrix.release_file }}"
              tar -czvf antigravity-zh-macos.tar.gz "${{ matrix.release_file }}"
            fi
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.release_file }}
            *.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release_assets
          find all_artifacts -type f \( -name "*.exe" -o -name "*.tar.gz" -o -name "antigravity-zh-macos" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
